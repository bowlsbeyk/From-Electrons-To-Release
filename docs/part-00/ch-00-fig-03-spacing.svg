<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>What a spaced-repetition scheduler does</title>
  <desc>A chart of the chance of recalling one fact over thirty days. A grey curve shows a fact learned once and never reviewed: the chance drops steeply at first, then more slowly. A blue curve shows the same fact reviewed each time the chance falls to about ninety percent: each review resets it to one hundred and the next decline is slower, so the reviews come at roughly one, three, eight and nineteen days. A dashed line marks ninety percent, the default target. The caption notes this is the shape of the FSRS model, not measured data.</desc>
  <rect x="0" y="0" width="960" height="460" fill="#FFFFFF"/>
  <text x="24" y="36" font-size="20" font-weight="600" fill="#1F2937">What a scheduler does for you</text>
  <text x="24" y="56" font-size="11" fill="#6B7280">Schematic: the shape of the FSRS memory model, not measured data. Days on the bottom, chance of recall on the side.</text>
  <line x1="72" y1="80" x2="72" y2="364" stroke="#1F2937" stroke-width="1.5"/>
  <line x1="72" y1="364" x2="936" y2="364" stroke="#1F2937" stroke-width="1.5"/>
  <line x1="72" y1="364.0" x2="936" y2="364.0" stroke="#E5E7EB" stroke-width="1"/>
  <text x="64" y="368.0" font-size="11" text-anchor="end" fill="#6B7280">50%</text>
  <line x1="72" y1="307.2" x2="936" y2="307.2" stroke="#E5E7EB" stroke-width="1"/>
  <text x="64" y="311.2" font-size="11" text-anchor="end" fill="#6B7280">60%</text>
  <line x1="72" y1="250.4" x2="936" y2="250.4" stroke="#E5E7EB" stroke-width="1"/>
  <text x="64" y="254.4" font-size="11" text-anchor="end" fill="#6B7280">70%</text>
  <line x1="72" y1="193.6" x2="936" y2="193.6" stroke="#E5E7EB" stroke-width="1"/>
  <text x="64" y="197.6" font-size="11" text-anchor="end" fill="#6B7280">80%</text>
  <line x1="72" y1="136.8" x2="936" y2="136.8" stroke="#E5E7EB" stroke-width="1"/>
  <text x="64" y="140.8" font-size="11" text-anchor="end" fill="#6B7280">90%</text>
  <line x1="72" y1="80.0" x2="936" y2="80.0" stroke="#E5E7EB" stroke-width="1"/>
  <text x="64" y="84.0" font-size="11" text-anchor="end" fill="#6B7280">100%</text>
  <text x="72.0" y="382" font-size="11" text-anchor="middle" fill="#6B7280">0</text>
  <text x="216.0" y="382" font-size="11" text-anchor="middle" fill="#6B7280">5</text>
  <text x="360.0" y="382" font-size="11" text-anchor="middle" fill="#6B7280">10</text>
  <text x="504.0" y="382" font-size="11" text-anchor="middle" fill="#6B7280">15</text>
  <text x="648.0" y="382" font-size="11" text-anchor="middle" fill="#6B7280">20</text>
  <text x="792.0" y="382" font-size="11" text-anchor="middle" fill="#6B7280">25</text>
  <text x="936.0" y="382" font-size="11" text-anchor="middle" fill="#6B7280">30</text>
  <text x="504.0" y="400" font-size="11" text-anchor="middle" fill="#1F2937">days since you first learned it</text>
  <text x="20" y="222.0" font-size="11" text-anchor="middle" fill="#1F2937" transform="rotate(-90 20 222.0)">chance you can recall it</text>
  <line x1="72" y1="136.8" x2="936" y2="136.8" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
