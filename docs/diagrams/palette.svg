<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Palette — From Electrons to Releases</title>
  <desc>The seventeen color tokens used in every diagram in the book, shown as swatches with their names and hex values. Twelve domain colors map to the parts of the book; five neutrals cover paper, ink, muted text, grid lines, and highlight.</desc>
  <rect x="0" y="0" width="960" height="400" fill="#FFFFFF"/>
  <text x="24" y="36" font-size="20" font-weight="600" fill="#1F2937">Palette</text>
  <text x="24" y="58" font-size="11" fill="#6B7280">Domain colors: stroke at full strength, fill at 12% opacity. Text is always ink or muted.</text>

  <!-- Neutrals -->
  <text x="24" y="92" font-size="14" font-weight="600" fill="#1F2937">Neutrals</text>
  <g id="sw-paper"><rect x="24" y="104" width="120" height="40" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/><text x="84" y="128" font-size="12" text-anchor="middle" fill="#1F2937">paper</text><text x="84" y="160" font-size="11" text-anchor="middle" fill="#6B7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">#FFFFFF</text></g>
  <g id="sw-ink"><rect x="156" y="104" width="120" height="40" rx="4" fill="#1F2937"/><text x="216" y="128" font-size="12" text-anchor="middle" fill="#FFFFFF">ink</text><text x="216" y="160" font-size="11" text-anchor="middle" fill="#6B7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">#1F2937</text></g>
  <g id="sw-muted"><rect x="288" y="104" width="120" height="40" rx="4" fill="#6B7280"/><text x="348" y="128" font-size="12" text-anchor="middle" fill="#FFFFFF">muted</text><text x="348" y="160" font-size="11" text-anchor="middle" fill="#6B7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">#6B7280</text></g>
  <g id="sw-grid"><rect x="420" y="104" width="120" height="40" rx="4" fill="#E5E7EB"/><text x="480" y="128" font-size="12" text-anchor="middle" fill="#1F2937">grid</text><text x="480" y="160" font-size="11" text-anchor="middle" fill="#6B7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">#E5E7EB</text></g>
  <g id="sw-highlight"><rect x="552" y="104" width="120" height="40" rx="4" fill="#FACC15"/><text x="612" y="128" font-size="12" text-anchor="middle" fill="#1F2937">highlight</text><text x="612" y="160" font-size="11" text-anchor="middle" fill="#6B7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">#FACC15</text></g>

  <!-- Domains, row 1 -->
  <text x="24" y="204" font-size="14" font-weight="600" fill="#1F2937">Domains (bottom of the stack to top)</text>
  <g id="sw-physics"><rect x="24" y="216" width="120" height="40" rx="4" fill="#D97706" fill-opacity="0.12" stroke="#D97706" stroke-width="1.5"/><text x="84" y="240" font-size="12" text-anchor="middle" fill="#1F2937">physics</text><text x="84" y="272" font-size="11" text-anchor="middle" fill="#6B7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">#D97706</text></g>
  <g id="sw-logic"><rect x="156" y="216" width="120" height="40" rx="4" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="1.5"/><text x="216" y="240" font-size="12" text-anchor="middle" fill="#1F2937">logic</text><text x="216" y="272" font-size="11" text-anchor="middle" fill="#6B7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">#2563EB</text></g>
  <g id="sw-wires"><rect x="288" y="216" width="120" height="40" rx="4" fill="#0D9488" fill-opacity="0.12" stroke="#0D9488" stroke-width="1.5"/><text x="348" y="240" font-size="12" text-anchor="middle" fill="#1F2937">wires</text><text x="348" y="272" font-size="11" text-anchor="middle" fill="#6B7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">#0D9488</text></g>
  <g id="sw-peripherals"><rect x="420" y="216" width="120" height="40" rx="4" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-width="1.5"/><text x="480" y="240" font-size="12" text-anchor="middle" fill="#1F2937">peripherals</text><text x="480" y="272" font-size="11" text-anchor="middle" fill="#6B7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">#7C3AED</text></g>
  <g id="sw-code"><rect x="552" y="216" width="120" height="40" rx="4" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="1.5"/><text x="612" y="240" font-size="12" text-anchor="middle" fill="#1F2937">code</text><text x="612" y="272" font-size="11" text-anchor="middle" fill="#6B7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">#16A34A</text></g>
  <g id="sw-os"><rect x="684" y="216" width="120" height="40" rx="4" fill="#0891B2" fill-opacity="0.12" stroke="#0891B2" stroke-width="1.5"/><text x="744" y="240" font-size="12" text-anchor="middle" fill="#1F2937">os</text><text x="744" y="272" font-size="11" text-anchor="middle" fill="#6B7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">#0891B2</text></g>

  <!-- Domains, row 2 -->
  <g id="sw-program"><rect x="24" y="296" width="120" height="40" rx="4" fill="#65A30D" fill-opacity="0.12" stroke="#65A30D" stroke-width="1.5"/><text x="84" y="320" font-size="12" text-anchor="middle" fill="#1F2937">program</text><text x="84" y="352" font-size="11" text-anchor="middle" fill="#6B7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">#65A30D</text></g>
  <g id="sw-network"><rect x="156" y="296" width="120" height="40" rx="4" fill="#DB2777" fill-opacity="0.12" stroke="#DB2777" stroke-width="1.5"/><text x="216" y="320" font-size="12" text-anchor="middle" fill="#1F2937">network</text><text x="216" y="352" font-size="11" text-anchor="middle" fill="#6B7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">#DB2777</text></g>
  <g id="sw-systems"><rect x="288" y="296" width="120" height="40" rx="4" fill="#4F46E5" fill-opacity="0.12" stroke="#4F46E5" stroke-width="1.5"/><text x="348" y="320" font-size="12" text-anchor="middle" fill="#1F2937">systems</text><text x="348" y="352" font-size="11" text-anchor="middle" fill="#6B7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">#4F46E5</text></g>
  <g id="sw-trust"><rect x="420" y="296" width="120" height="40" rx="4" fill="#DC2626" fill-opacity="0.12" stroke="#DC2626" stroke-width="1.5"/><text x="480" y="320" font-size="12" text-anchor="middle" fill="#1F2937">trust</text><text x="480" y="352" font-size="11" text-anchor="middle" fill="#6B7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">#DC2626</text></g>
  <g id="sw-ship"><rect x="552" y="296" width="120" height="40" rx="4" fill="#EA580C" fill-opacity="0.12" stroke="#EA580C" stroke-width="1.5"/><text x="612" y="320" font-size="12" text-anchor="middle" fill="#1F2937">ship</text><text x="612" y="352" font-size="11" text-anchor="middle" fill="#6B7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">#EA580C</text></g>
  <g id="sw-ai"><rect x="684" y="296" width="120" height="40" rx="4" fill="#C026D3" fill-opacity="0.12" stroke="#C026D3" stroke-width="1.5"/><text x="744" y="320" font-size="12" text-anchor="middle" fill="#1F2937">ai</text><text x="744" y="352" font-size="11" text-anchor="middle" fill="#6B7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">#C026D3</text></g>
</svg>
